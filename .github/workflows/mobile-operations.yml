name: Mobile Operations

on:
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * 1-5"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/mobile-operations.yml"
      - "package.json"
      - "package-lock.json"
      - "scripts/mobile-operations-fixture.ts"
      - "scripts/test-mobile-agent-device.sh"
      - "packages/app/app.config.js"
      - "packages/app/e2e/mobile/agent-device/operations-matrix.*.ad"
      - "packages/app/e2e/support/helpers/operations-*.ts"
      - "packages/app/src/components/headers/menu-header.tsx"
      - "packages/app/src/components/left-sidebar.tsx"
      - "packages/app/src/operations/**"
      - "packages/app/src/runtime/host-runtime.ts"
      - "packages/server/src/server/agent/providers/mock-load-test-agent.ts"

concurrency:
  group: mobile-operations-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  ios:
    name: operations (iOS)
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Build the daemon stack and native app module
        run: |
          npm run build:server
          npm run build --workspace=@getpaseo/expo-two-way-audio

      - name: Select and boot an iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          ios_udid="$(xcrun simctl list devices available -j | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => {
              const runtimes = Object.entries(JSON.parse(input).devices)
                .filter(([runtime]) => runtime.includes("iOS"))
                .sort(([left], [right]) => right.localeCompare(left));
              const device = runtimes
                .flatMap(([, devices]) => devices)
                .find((candidate) => candidate.isAvailable && candidate.name.includes("iPhone"));
              if (!device) process.exit(1);
              process.stdout.write(device.udid);
            });
          ')"
          echo "IOS_UDID=$ios_udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$ios_udid"
          xcrun simctl bootstatus "$ios_udid" -b

      - name: Build and install the iOS development app
        working-directory: packages/app
        env:
          APP_VARIANT: development
        run: |
          CI=1 npx expo prebuild --platform ios --clean
          # Expo CLI 54 forces Metro on when Debug is explicit; Debug is already the default.
          npx expo run:ios --device "$IOS_UDID" --no-bundler

      - name: Run the iOS Operations matrix
        env:
          PASEO_MOBILE_E2E_PLATFORM: ios
          PASEO_MOBILE_E2E_DEVICE: ${{ env.IOS_UDID }}
          PASEO_MOBILE_E2E_OPERATIONS_FIXTURE: "1"
          PASEO_MOBILE_E2E_ARTIFACTS_DIR: ${{ runner.temp }}/mobile-operations-ios
          PASEO_MOBILE_E2E_JUNIT_PATH: ${{ runner.temp }}/mobile-operations-ios/junit.xml
        run: npm run test:e2e:mobile

      - name: Upload iOS evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-operations-ios
          path: ${{ runner.temp }}/mobile-operations-ios
          if-no-files-found: warn
          retention-days: 14

  android:
    name: operations (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Build the daemon stack and native app module
        run: |
          npm run build:server
          npm run build --workspace=@getpaseo/expo-two-way-audio

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the Android development app
        env:
          APP_VARIANT: development
        run: |
          cd packages/app
          CI=1 npx expo prebuild --platform android --clean
          cd android
          ./gradlew assembleDebug -PreactNativeArchitectures=x86_64

      - name: Run the Android Operations matrix
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2.34.0
        env:
          PASEO_MOBILE_E2E_PLATFORM: android
          PASEO_MOBILE_E2E_OPERATIONS_FIXTURE: "1"
          PASEO_MOBILE_E2E_ARTIFACTS_DIR: ${{ runner.temp }}/mobile-operations-android
          PASEO_MOBILE_E2E_JUNIT_PATH: ${{ runner.temp }}/mobile-operations-android/junit.xml
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r packages/app/android/app/build/outputs/apk/debug/app-debug.apk
            npm run test:e2e:mobile

      - name: Upload Android evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-operations-android
          path: ${{ runner.temp }}/mobile-operations-android
          if-no-files-found: warn
          retention-days: 14
