name: Mobile Operations, Visual, and Teams

on:
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * 1-5"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/mobile-operations.yml"
      - "package.json"
      - "package-lock.json"
      - "scripts/mobile-operations-fixture.ts"
      - "scripts/test-mobile-agent-device.sh"
      - "scripts/test-mobile-operations-agent-device.sh"
      - "scripts/run-mobile-operations-matrix.sh"
      - "packages/app/app.config.js"
      - "packages/app/native-release-version.js"
      - "packages/app/plugins/**"
      - "packages/app/e2e/mobile/operations-agent-device/operations-matrix.*.ad"
      - "packages/app/e2e/mobile/teams-agent-device/teams-matrix.*.ad"
      - "packages/app/e2e/mobile/visual-agent-device/visual-matrix.*.ad"
      - "packages/app/e2e/support/helpers/agent-profiles.ts"
      - "packages/app/e2e/support/helpers/operations-*.ts"
      - "packages/app/e2e/support/helpers/teams.ts"
      - "packages/app/src/components/headers/menu-header.tsx"
      - "packages/app/src/components/left-sidebar.tsx"
      - "packages/app/src/operations/**"
      - "packages/app/src/push-notifications/**"
      - "packages/app/src/runtime/host-runtime.ts"
      - "packages/app/src/teams/**"
      - "packages/expo-two-way-audio/**"
      - "packages/protocol/src/team/**"
      - "packages/server/src/server/agent/providers/mock-load-test-agent.ts"
      - "packages/server/src/server/team/**"
      - "patches/**"

concurrency:
  group: mobile-operations-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  validate:
    name: validate mobile Operations, Visual, and Teams
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate workflow and replay contracts
        run: |
          bash -n scripts/test-mobile-agent-device.sh
          bash -n scripts/test-mobile-operations-agent-device.sh
          bash -n scripts/run-mobile-operations-matrix.sh
          node --test scripts/ci-workflow.test.mjs

  ios:
    name: operations + visual + teams (iOS)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Build the daemon stack and native app module
        run: |
          npm run build:server
          npm run build --workspace=@getpaseo/expo-two-way-audio

      - name: Restore the iOS development app
        id: ios-app-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .dev/mobile-build-cache/ios/ConsolidatedComputeDebug.app
          key: mobile-operations-ios-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'package-lock.json', 'packages/app/package.json', 'packages/app/app.config.js', 'packages/app/native-release-version.js', 'packages/app/plugins/**', 'packages/app/assets/images/**', 'packages/expo-two-way-audio/package.json', 'packages/expo-two-way-audio/expo-module.config.json', 'packages/expo-two-way-audio/ios/**', 'patches/**') }}

      - name: Select and boot an iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          ios_udid="$(xcrun simctl list devices available -j | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => {
              const runtimes = Object.entries(JSON.parse(input).devices)
                .filter(([runtime]) => runtime.includes("iOS"))
                .sort(([left], [right]) => right.localeCompare(left));
              const device = runtimes
                .flatMap(([, devices]) => devices)
                .find((candidate) => candidate.isAvailable && candidate.name.includes("iPhone"));
              if (!device) process.exit(1);
              process.stdout.write(device.udid);
            });
          ')"
          echo "IOS_UDID=$ios_udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$ios_udid"
          xcrun simctl bootstatus "$ios_udid" -b

      - name: Build and install the iOS development app
        if: steps.ios-app-cache.outputs.cache-hit != 'true'
        working-directory: packages/app
        env:
          APP_VARIANT: development
        run: |
          CI=1 npx expo prebuild --platform ios --clean
          # Expo CLI 54 forces Metro on when Debug is explicit; Debug is already the default.
          npx expo run:ios --device "$IOS_UDID" --no-bundler
          built_app="$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*/Build/Products/Debug-iphonesimulator/ConsolidatedComputeDebug.app' -print -quit)"
          test -n "$built_app"
          mkdir -p "$GITHUB_WORKSPACE/.dev/mobile-build-cache/ios"
          ditto "$built_app" "$GITHUB_WORKSPACE/.dev/mobile-build-cache/ios/ConsolidatedComputeDebug.app"

      - name: Install the cached iOS development app
        if: steps.ios-app-cache.outputs.cache-hit == 'true'
        run: xcrun simctl install "$IOS_UDID" .dev/mobile-build-cache/ios/ConsolidatedComputeDebug.app

      - name: Save the iOS development app
        if: steps.ios-app-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .dev/mobile-build-cache/ios/ConsolidatedComputeDebug.app
          key: ${{ steps.ios-app-cache.outputs.cache-primary-key }}

      - name: Run the iOS Operations, Visual, and Teams matrices
        env:
          PASEO_MOBILE_E2E_PLATFORM: ios
          PASEO_MOBILE_E2E_DEVICE: ${{ env.IOS_UDID }}
          EVIDENCE_ROOT: ${{ runner.temp }}/mobile-operations-visual-teams-ios
        run: bash scripts/run-mobile-operations-matrix.sh

      - name: Upload iOS evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-operations-visual-teams-ios
          path: ${{ runner.temp }}/mobile-operations-visual-teams-ios
          if-no-files-found: warn
          retention-days: 14

  android:
    name: operations + visual + teams (Android)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Build the daemon stack and native app module
        run: |
          npm run build:server
          npm run build --workspace=@getpaseo/expo-two-way-audio

      - name: Restore the Android development app
        id: android-app-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .dev/mobile-build-cache/android/app-debug.apk
          key: mobile-operations-android-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'package-lock.json', 'packages/app/package.json', 'packages/app/app.config.js', 'packages/app/native-release-version.js', 'packages/app/plugins/**', 'packages/app/assets/images/**', 'packages/expo-two-way-audio/package.json', 'packages/expo-two-way-audio/expo-module.config.json', 'packages/expo-two-way-audio/android/**', 'patches/**') }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the Android development app
        if: steps.android-app-cache.outputs.cache-hit != 'true'
        env:
          APP_VARIANT: development
        run: |
          cd packages/app
          CI=1 npx expo prebuild --platform android --clean
          cd android
          ./gradlew assembleDebug -PreactNativeArchitectures=x86_64
          mkdir -p "$GITHUB_WORKSPACE/.dev/mobile-build-cache/android"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/.dev/mobile-build-cache/android/app-debug.apk"

      - name: Save the Android development app
        if: steps.android-app-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .dev/mobile-build-cache/android/app-debug.apk
          key: ${{ steps.android-app-cache.outputs.cache-primary-key }}

      - name: Run the Android Operations, Visual, and Teams matrices
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2.34.0
        env:
          PASEO_MOBILE_E2E_PLATFORM: android
          PASEO_MOBILE_E2E_SERIAL: emulator-5554
          EVIDENCE_ROOT: ${{ runner.temp }}/mobile-operations-visual-teams-android
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          script: |
            adb install -r .dev/mobile-build-cache/android/app-debug.apk
            bash scripts/run-mobile-operations-matrix.sh

      - name: Upload Android evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-operations-visual-teams-android
          path: ${{ runner.temp }}/mobile-operations-visual-teams-android
          if-no-files-found: warn
          retention-days: 14
