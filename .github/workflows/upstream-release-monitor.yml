name: Upstream Stable Release Monitor

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

concurrency:
  group: upstream-stable-release-monitor
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  stage-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Stage a new stable release
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORK_REPOSITORY: ${{ github.repository }}
          UPSTREAM_REPOSITORY: getpaseo/paseo
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ]]; then
            echo "::error::Run this workflow from the default branch (${DEFAULT_BRANCH})."
            exit 1
          fi

          fork_sha="$(git rev-parse HEAD)"
          release_json="$(gh api "repos/${UPSTREAM_REPOSITORY}/releases/latest")"
          release_tag="$(jq -r '.tag_name' <<<"${release_json}")"
          release_url="$(jq -r '.html_url' <<<"${release_json}")"
          published_at="$(jq -r '.published_at' <<<"${release_json}")"
          is_draft="$(jq -r '.draft' <<<"${release_json}")"
          is_prerelease="$(jq -r '.prerelease' <<<"${release_json}")"

          if [[ "${is_draft}" != "false" || "${is_prerelease}" != "false" ]]; then
            echo "::error::GitHub returned a draft or prerelease from releases/latest."
            exit 1
          fi
          if [[ ! "${release_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Latest stable release tag is not vMAJOR.MINOR.PATCH: ${release_tag}"
            exit 1
          fi

          release_ref="refs/remotes/upstream/releases/${release_tag}"
          git fetch --no-tags https://github.com/getpaseo/paseo.git \
            "refs/tags/${release_tag}:${release_ref}"
          release_sha="$(git rev-parse "${release_ref}^{commit}")"

          if git merge-base --is-ancestor "${release_sha}" HEAD; then
            echo "${release_tag} (${release_sha}) is already integrated."
            exit 0
          fi

          issue_title="Sync Paseo ${release_tag}"
          existing_sync="$(
            gh api --method GET search/issues \
              -f q="repo:${FORK_REPOSITORY} in:title ${release_tag}" |
              jq -r \
                --arg issue_title "${issue_title}" \
                --arg release_tag "${release_tag}" \
                '.items
                  | map(select(
                      .title == $issue_title
                      or (has("pull_request") and (.title | contains($release_tag)))
                    ))
                  | .[0].html_url // empty'
          )"

          if [[ -n "${existing_sync}" ]]; then
            echo "Sync issue or pull request already exists: ${existing_sync}"
            exit 0
          fi

          body_file="$(mktemp)"
          trap 'rm -f "${body_file}"' EXIT
          cat >"${body_file}" <<EOF
          Paseo published stable release [${release_tag}](${release_url}) on ${published_at}.

          - Release commit: \`${release_sha}\`
          - Fork \`${DEFAULT_BRANCH}\` when detected: \`${fork_sha}\`

          Follow [the fork-maintenance playbook](https://github.com/${FORK_REPOSITORY}/blob/${DEFAULT_BRANCH}/docs/fork-maintenance.md) to prepare a signed draft sync pull request. Preserve upstream ancestry, record divergence and conflict evidence, and keep inherited delivery workflows quarantined.

          Classify every sync review finding before changing code:

          - **Fork adaptation or conflict:** fix it in the sync pull request.
          - **Upstream-inherited release blocker:** patch it locally and link an upstream issue or pull request.
          - **Upstream-inherited non-blocker:** track it separately; do not expand the sync.
          - **Pre-existing fork issue:** keep it out of scope and link a follow-up when material.

          Compare the signed merge result with both parents and record each finding's provenance and disposition in the pull request. Impact and provenance are separate: inherited compatibility, security, data, or required-platform failures can still block the fork release.

          This issue was opened by the scheduled upstream stable-release monitor. It does not sync prereleases or upstream \`main\`.
          EOF

          gh issue create \
            --repo "${FORK_REPOSITORY}" \
            --title "${issue_title}" \
            --body-file "${body_file}"
